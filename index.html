<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello World</title>
<style>
  :root {
    --bg: #F8FAFC; --glow1: rgba(99,102,241,.14); --glow2: rgba(14,165,233,.12);
    --card: rgba(255,255,255,.78); --border: rgba(226,232,240,.8);
    --text: #0F172A; --muted: #475569;
    --accent: linear-gradient(135deg, #4F46E5 0%, #0284C7 100%);
    --badge-bg: #EEF2FF; --badge-text: #4338CA; --dot: #10B981;
    --shadow: 0 20px 50px -12px rgba(15,23,42,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #090D16; --glow1: rgba(99,102,241,.22); --glow2: rgba(56,189,248,.15);
      --card: rgba(15,23,42,.72); --border: rgba(255,255,255,.10);
      --text: #F8FAFC; --muted: #94A3B8;
      --accent: linear-gradient(135deg, #818CF8 0%, #38BDF8 100%);
      --badge-bg: rgba(79,70,229,.18); --badge-text: #C7D2FE; --dot: #34D399;
      --shadow: 0 25px 60px -15px rgba(0,0,0,.6);
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100dvh; display: grid; place-items: center; padding: 1.5rem;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    color: var(--text); background-color: var(--bg);
    background-image: radial-gradient(circle at 15% 20%, var(--glow1), transparent 50%),
                      radial-gradient(circle at 85% 80%, var(--glow2), transparent 50%);
  }
  main {
    width: 100%; max-width: 520px; padding: 3rem 2.5rem; text-align: center;
    background: var(--card); border: 1px solid var(--border); border-radius: 24px;
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    box-shadow: var(--shadow); transition: transform 250ms ease;
  }
  main:hover { transform: translateY(-2px); }
  .pill {
    display: inline-flex; align-items: center; gap: .5rem; margin-bottom: 1.5rem;
    padding: .375rem .875rem; border-radius: 9999px; background: var(--badge-bg);
    color: var(--badge-text); font-size: .75rem; font-weight: 600;
    letter-spacing: .08em; text-transform: uppercase;
  }
  .dot { width: .5rem; height: .5rem; border-radius: 50%; background: var(--dot); animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; transform: scale(.8); } }
  h1 { font-size: clamp(2.5rem, 6vw, 3.75rem); font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }
  h1 span { background: var(--accent); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
  p { max-width: 38ch; margin: 1rem auto 0; font-size: clamp(1rem, 2.2vw, 1.125rem); line-height: 1.6; color: var(--muted); }
  @media (max-width: 480px) { main { padding: 2rem 1.5rem; border-radius: 20px; } }
  @media (prefers-reduced-motion: reduce) {
    .dot { animation: none; }
    main { transition: none; }
    main:hover { transform: none; }
  }
</style>
</head>
<body>
  <main>
    <div class="pill"><span class="dot" aria-hidden="true"></span>Live</div>
    <h1>Hello <span>World</span></h1>
    <p>A simple, modern page built with clean HTML and CSS.</p>
  </main>
</body>
</html>
